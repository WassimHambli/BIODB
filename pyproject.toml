[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "biodb-client"
dynamic = ["version"]
description = "Typed Python client for UniProt, RCSB PDB, Ensembl and NCBI E-utilities with caching, rate limiting and retries"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["bioinformatics", "uniprot", "pdb", "ensembl", "ncbi", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.9,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.17,<0.18",
    "mypy>=1.10,<3",
]

[tool.hatch.version]
path = "src/biodb/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/biodb"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "scripts", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not live' --cov=biodb --cov-report=term-missing --cov-fail-under=95"
markers = ["live: hits the real public APIs (opt-in: pytest -m live)"]

[tool.coverage.run]
source = ["biodb"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "W"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
